[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"
  port = 8888

[[redirects]]
  from = "/api/*"
  to = "http://localhost:5000/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/generate-image"
  to = "http://localhost:5000/generate-image"
  status = 200
  force = true
